name: financeiro-web — Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22.x"

jobs:
  # ─────────────────────────────────────────
  # 1. BUILD & TEST
  # ─────────────────────────────────────────
  frontend-ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests (Vitest)
        run: npm run test:ci

      - name: Build production
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://financeiro-api-yi40.onrender.com' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: dist/

  # ─────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH — desabilitado
  # (deploy gerenciado pelo Vercel via GitHub)
  # ─────────────────────────────────────────
  docker-build:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: false

    steps:
      - name: Skipped
        run: echo "Deploy is handled by Vercel"

  # ─────────────────────────────────────────
  # 3. DEPLOY — desabilitado
  # (deploy gerenciado pelo Vercel via GitHub)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: false

    steps:
      - name: Skipped
        run: echo "Deploy is handled by Vercel"